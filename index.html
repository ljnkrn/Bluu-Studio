<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bluu Studio</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --bg-panel: #171a21;
      --bg-card: #1f242d;
      --bluu: #ADD7FF;
      --pink: #FFC0CB;
      --text-main: #f4f6fa;
      --text-muted: #8e96a4;
      --border: #2a303c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HOME SCREEN */
    #home-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 24px;
      background: radial-gradient(circle at top right, rgba(173, 215, 255, 0.12), transparent 50%),
                  radial-gradient(circle at bottom left, rgba(255, 192, 203, 0.12), transparent 50%);
    }

    .brand-badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(173, 215, 255, 0.15);
      border: 1px solid var(--bluu);
      color: var(--bluu);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--bluu), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    .new-project-btn {
      width: 100%;
      max-width: 280px;
      padding: 18px 24px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--bluu), var(--pink));
      color: #0f1115;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(173, 215, 255, 0.25);
      transition: transform 0.15s ease;
    }

    .new-project-btn:active {
      transform: scale(0.97);
    }

    /* EDITOR SCREEN */
    #editor-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    /* TOP BAR */
    .top-bar {
      height: 52px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn:active {
      background: var(--bg-card);
    }

    .ratio-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--bluu);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .export-btn {
      background: linear-gradient(135deg, var(--bluu), var(--pink));
      color: #0f1115;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* PREVIEW AREA */
    .preview-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      overflow: hidden;
      padding: 12px;
    }

    .canvas-wrapper {
      position: relative;
      aspect-ratio: 9 / 16;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      background: #000;
      box-shadow: 0 0 0 1px var(--border);
      overflow: hidden;
      touch-action: none;
    }

    #preview-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SNAPPING GUIDES */
    .snap-guide-v, .snap-guide-h {
      position: absolute;
      background: var(--pink);
      pointer-events: none;
      display: none;
      z-index: 10;
    }
    .snap-guide-v {
      top: 0; bottom: 0; left: 50%; width: 1px;
      box-shadow: 0 0 6px var(--pink);
    }
    .snap-guide-h {
      left: 0; right: 0; top: 50%; height: 1px;
      box-shadow: 0 0 6px var(--pink);
    }

    /* PLAYBACK CONTROLS */
    .playback-bar {
      height: 44px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .time-display {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .time-display span {
      color: var(--bluu);
      font-weight: 700;
    }

    .play-toggle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--bluu);
      color: #0f1115;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* TIMELINE */
    .timeline-section {
      height: 165px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .timeline-ruler {
      height: 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding-left: 50%;
      font-size: 10px;
      color: var(--text-muted);
      position: relative;
    }

    .timeline-scroll {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      padding: 14px 50%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-scroll::-webkit-scrollbar {
      display: none;
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: var(--pink);
      z-index: 15;
      pointer-events: none;
    }

    .playhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: -5px;
      width: 12px;
      height: 12px;
      background: var(--pink);
      border-radius: 3px;
    }

    .track-row {
      display: flex;
      align-items: center;
      height: 48px;
      position: relative;
      gap: 3px;
    }

    .clip-block {
      height: 46px;
      background: linear-gradient(90deg, rgba(173, 215, 255, 0.25), rgba(255, 192, 203, 0.25));
      border: 2px solid var(--border);
      border-radius: 10px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
      overflow: visible;
    }

    .clip-block.selected {
      border-color: var(--bluu);
      box-shadow: 0 0 12px rgba(173, 215, 255, 0.25);
    }

    .clip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* INDEPENDENT TRIM HANDLES */
    .trim-handle {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 16px;
      background: var(--bluu);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 12;
      touch-action: none;
      cursor: ew-resize;
    }

    .clip-block.selected .trim-handle {
      display: flex;
    }

    .trim-handle.left {
      left: -8px;
      border-radius: 8px 0 0 8px;
    }

    .trim-handle.right {
      right: -8px;
      border-radius: 0 8px 8px 0;
    }

    .trim-handle::after {
      content: "";
      width: 2px;
      height: 16px;
      background: #0f1115;
      border-radius: 2px;
    }

    .keyframe-dot {
      position: absolute;
      bottom: 4px;
      width: 8px;
      height: 8px;
      background: var(--pink);
      transform: rotate(45deg);
      border: 1px solid #0f1115;
      pointer-events: none;
    }

    /* AUDIO TRACK */
    .audio-track-row {
      height: 30px;
      display: flex;
      align-items: center;
    }

    .audio-clip {
      height: 28px;
      background: rgba(255, 192, 203, 0.2);
      border: 1px solid var(--pink);
      border-radius: 8px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--pink);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* TOOLBAR */
    .toolbar {
      height: 68px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      overflow-x: auto;
      padding: 0 10px;
      gap: 6px;
    }

    .toolbar::-webkit-scrollbar {
      display: none;
    }

    .tool-item {
      min-width: 66px;
      height: 54px;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tool-item:active {
      background: var(--bg-card);
    }

    .tool-icon {
      font-size: 17px;
      color: var(--bluu);
    }

    /* BOTTOM DRAWER / SUB-PANEL */
    .sub-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 16px 18px 24px;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }

    .sub-panel.active {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--bluu);
    }

    .panel-close {
      background: var(--bg-card);
      border: none;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .curve-presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .preset-chip {
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .preset-chip.active {
      border-color: var(--pink);
      background: rgba(255, 192, 203, 0.15);
      color: var(--pink);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--bluu);
    }

    /* MODAL EXPORT */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-card);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--bluu), var(--pink));
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="brand-badge">bluuarchive studio</div>
    <h1 class="brand-title">Bluu Studio</h1>
    <p class="brand-sub">Editor video 9:16 ringkas dengan trim presisi, kurva kecepatan, dan ekstrak audio.</p>
    <button class="new-project-btn" id="btn-new-project">
      <span>+</span> Proyek Baru
    </button>
    <input type="file" id="video-input" accept="video/*" hidden />
    <input type="file" id="add-clip-input" accept="video/*" hidden />
  </div>

  <!-- EDITOR SCREEN -->
  <div id="editor-screen">
    <div class="top-bar">
      <button class="icon-btn" id="btn-back">← Keluar</button>
      <div class="ratio-pill">9:16</div>
      <button class="export-btn" id="btn-export">Ekspor</button>
    </div>

    <div class="preview-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="preview-canvas" width="720" height="1280"></canvas>
        <div class="snap-guide-v" id="snap-v"></div>
        <div class="snap-guide-h" id="snap-h"></div>
      </div>
    </div>

    <div class="playback-bar">
      <div class="time-display"><span id="cur-time">00:00.0</span> / <span id="tot-time">00:00.0</span></div>
      <button class="play-toggle" id="btn-play">▶</button>
      <button class="icon-btn" id="btn-keyframe" style="color: var(--pink); font-size: 12px;">◆ Keyframe</button>
    </div>

    <div class="timeline-section">
      <div class="playhead"></div>
      <div class="timeline-ruler" id="timeline-ruler">0s</div>
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="track-row" id="video-track"></div>
        <div class="audio-track-row" id="audio-track"></div>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-item" id="tool-add"><span class="tool-icon">＋</span>Tambah</button>
      <button class="tool-item" id="tool-split"><span class="tool-icon">✂</span>Split</button>
      <button class="tool-item" id="tool-speed"><span class="tool-icon">⚡</span>Kecepatan</button>
      <button class="tool-item" id="tool-extract"><span class="tool-icon">🎵</span>Ekstrak Audio</button>
      <button class="tool-item" id="tool-fit"><span class="tool-icon">⊡</span>Reset Posisi</button>
      <button class="tool-item" id="tool-delete"><span class="tool-icon" style="color:#ff7b89;">🗑</span>Hapus</button>
    </div>
  </div>

  <!-- SPEED / CURVE PANEL -->
  <div class="sub-panel" id="speed-panel">
    <div class="panel-header">
      <span>Kecepatan & Kurva</span>
      <button class="panel-close" id="close-speed">Selesai</button>
    </div>
    <div class="curve-presets" id="curve-presets">
      <button class="preset-chip active" data-curve="normal">Normal (1.0x)</button>
      <button class="preset-chip" data-curve="montage">Kurva: Montage</button>
      <button class="preset-chip" data-curve="hero">Kurva: Hero</button>
      <button class="preset-chip" data-curve="bullet">Kurva: Bullet</button>
      <button class="preset-chip" data-curve="flashIn">Kurva: Flash In</button>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;">
        <span>Kecepatan Dasar</span>
        <span id="speed-val" style="color:var(--bluu); font-weight:700;">1.0x</span>
      </div>
      <input type="range" id="speed-slider" min="0.25" max="3.0" step="0.05" value="1.0" />
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal-card">
      <h3 style="color:var(--bluu); font-size:16px;" id="export-title">Mengekspor Video...</h3>
      <p style="font-size:12px; color:var(--text-muted);" id="export-desc">Jangan tutup halaman saat proses rendering berlangsung.</p>
      <div class="progress-bar">
        <div class="progress-fill" id="export-progress"></div>
      </div>
      <button class="export-btn" id="btn-download-result" style="display:none; width:100%; padding:12px;">Simpan ke Galeri</button>
      <button class="panel-close" id="btn-close-export" style="display:none; width:100%; padding:10px;">Tutup</button>
    </div>
  </div>

  <script>
    const PX_PER_SEC = 55;
    const state = {
      clips: [],
      audioTrack: null,
      selectedClipId: null,
      currentTime: 0,
      isPlaying: false,
      isExporting: false,
      animFrame: null,
      lastFrameTs: 0,
      isScrubbing: false
    };

    // DOM Elements
    const homeScreen = document.getElementById('home-screen');
    const editorScreen = document.getElementById('editor-screen');
    const videoInput = document.getElementById('video-input');
    const addClipInput = document.getElementById('add-clip-input');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');
    const snapV = document.getElementById('snap-v');
    const snapH = document.getElementById('snap-h');
    const videoTrack = document.getElementById('video-track');
    const audioTrackEl = document.getElementById('audio-track');
    const timelineScroll = document.getElementById('timeline-scroll');
    const curTimeEl = document.getElementById('cur-time');
    const totTimeEl = document.getElementById('tot-time');
    const btnPlay = document.getElementById('btn-play');

    // Web Audio for clean audio routing & export
    let audioCtx = null;
    let audioDest = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        audioDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function connectVideoAudio(videoEl) {
      try {
        initAudioContext();
        const source = audioCtx.createMediaElementSource(videoEl);
        source.connect(audioCtx.destination);
        source.connect(audioDest);
      } catch (e) {
        // Already connected
      }
    }

    // Navigation & File Load
    document.getElementById('btn-new-project').addEventListener('click', () => {
      videoInput.value = '';
      videoInput.click();
    });

    document.getElementById('tool-add').addEventListener('click', () => {
      addClipInput.value = '';
      addClipInput.click();
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      pausePlayback();
      state.clips.forEach(c => {
        c.video.pause();
        URL.revokeObjectURL(c.url);
      });
      state.clips = [];
      state.audioTrack = null;
      state.currentTime = 0;
      editorScreen.style.display = 'none';
      homeScreen.style.display = 'flex';
    });

    async function loadVideoFile(file, isFirst = false) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      const video = document.createElement('video');
      video.src = url;
      video.playsInline = true;
      video.preload = 'auto';
      video.crossOrigin = 'anonymous';

      await new Promise((resolve) => {
        video.onloadedmetadata = () => resolve();
      });

      connectVideoAudio(video);

      const clip = {
        id: 'clip_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: file.name,
        url,
        video,
        rawDuration: video.duration,
        trimStart: 0,
        trimEnd: video.duration,
        speed: 1.0,
        curve: 'normal',
        x: 0,
        y: 0,
        scale: 1,
        muted: false,
        keyframes: []
      };

      state.clips.push(clip);
      state.selectedClipId = clip.id;

      if (isFirst) {
        homeScreen.style.display = 'none';
        editorScreen.style.display = 'flex';
        state.currentTime = 0;
      }

      renderTimeline();
      await seekToTimelineTime(state.currentTime);
    }

    videoInput.addEventListener('change', (e) => loadVideoFile(e.target.files[0], true));
    addClipInput.addEventListener('change', (e) => loadVideoFile(e.target.files[0], false));

    // Curve Speed Calculation
    function getEffectiveSpeed(clip, localRatio) {
      const base = clip.speed;
      switch (clip.curve) {
        case 'montage':
          return base * (localRatio < 0.25 ? 0.6 : localRatio < 0.75 ? 1.8 : 0.7);
        case 'hero':
          return base * (localRatio < 0.35 ? 1.6 : localRatio < 0.65 ? 0.45 : 1.5);
        case 'bullet':
          return base * (localRatio > 0.3 && localRatio < 0.7 ? 0.4 : 1.5);
        case 'flashIn':
          return base * (localRatio < 0.3 ? 2.2 : 0.85);
        default:
          return base;
      }
    }

    function getClipDuration(clip) {
      const trimmed = Math.max(0.1, clip.trimEnd - clip.trimStart);
      let curveFactor = 1.0;
      if (clip.curve === 'montage') curveFactor = 1.15;
      if (clip.curve === 'hero') curveFactor = 0.9;
      if (clip.curve === 'bullet') curveFactor = 0.85;
      if (clip.curve === 'flashIn') curveFactor = 1.1;
      return trimmed / (clip.speed * curveFactor);
    }

    function getTotalDuration() {
      return state.clips.reduce((acc, c) => acc + getClipDuration(c), 0);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      const d = Math.floor((sec % 1) * 10);
      return `${m}:${s}.${d}`;
    }

    // Keyframe Interpolation
    function getTransformAtTime(clip, localTime) {
      if (!clip.keyframes || clip.keyframes.length === 0) {
        return { x: clip.x, y: clip.y, scale: clip.scale };
      }
      const sorted = [...clip.keyframes].sort((a, b) => a.time - b.time);
      if (localTime <= sorted[0].time) return sorted[0];
      if (localTime >= sorted[sorted.length - 1].time) return sorted[sorted.length - 1];

      for (let i = 0; i < sorted.length - 1; i++) {
        const k1 = sorted[i];
        const k2 = sorted[i + 1];
        if (localTime >= k1.time && localTime <= k2.time) {
          const t = (localTime - k1.time) / Math.max(0.001, k2.time - k1.time);
          return {
            x: k1.x + (k2.x - k1.x) * t,
            y: k1.y + (k2.y - k1.y) * t,
            scale: k1.scale + (k2.scale - k1.scale) * t
          };
        }
      }
      return { x: clip.x, y: clip.y, scale: clip.scale };
    }

    // Render Frame to Canvas
    function drawClipFrame(clip, localTime) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const v = clip.video;
      if (!v || v.readyState < 2) return;

      const vw = v.videoWidth || 720;
      const vh = v.videoHeight || 1280;
      const fitScale = Math.min(canvas.width / vw, canvas.height / vh);
      const tf = getTransformAtTime(clip, localTime);

      const drawW = vw * fitScale * tf.scale;
      const drawH = vh * fitScale * tf.scale;
      const drawX = (canvas.width - drawW) / 2 + tf.x;
      const drawY = (canvas.height - drawH) / 2 + tf.y;

      ctx.drawImage(v, drawX, drawY, drawW, drawH);
    }

    function getClipAtTimelineTime(t) {
      let acc = 0;
      for (let i = 0; i < state.clips.length; i++) {
        const dur = getClipDuration(state.clips[i]);
        if (t <= acc + dur || i === state.clips.length - 1) {
          return { clip: state.clips[i], offset: Math.max(0, t - acc), duration: dur };
        }
        acc += dur;
      }
      return null;
    }

    async function seekToTimelineTime(t) {
      const total = getTotalDuration();
      state.currentTime = Math.max(0, Math.min(t, total));
      curTimeEl.textContent = formatTime(state.currentTime);
      totTimeEl.textContent = formatTime(total);

      if (!state.isScrubbing) {
        timelineScroll.scrollLeft = state.currentTime * PX_PER_SEC;
      }

      const info = getClipAtTimelineTime(state.currentTime);
      if (!info) return;

      const { clip, offset, duration } = info;
      const ratio = Math.min(1, offset / Math.max(0.01, duration));
      const targetVideoTime = clip.trimStart + ratio * (clip.trimEnd - clip.trimStart);

      if (Math.abs(clip.video.currentTime - targetVideoTime) > 0.03) {
        clip.video.currentTime = Math.min(clip.video.duration - 0.01, Math.max(0, targetVideoTime));
        await new Promise((r) => {
          const onSeeked = () => {
            clip.video.removeEventListener('seeked', onSeeked);
            r();
          };
          clip.video.addEventListener('seeked', onSeeked);
          setTimeout(r, 80);
        });
      }
      drawClipFrame(clip, offset);
    }

    // Playback Loop
    function startPlayback() {
      if (state.clips.length === 0) return;
      initAudioContext();
      if (state.currentTime >= getTotalDuration() - 0.05) {
        state.currentTime = 0;
      }
      state.isPlaying = true;
      btnPlay.textContent = '❚❚';
      state.lastFrameTs = performance.now();
      requestAnimationFrame(playbackTick);
    }

    function pausePlayback() {
      state.isPlaying = false;
      btnPlay.textContent = '▶';
      state.clips.forEach(c => c.video.pause());
    }

    btnPlay.addEventListener('click', () => {
      if (state.isPlaying) pausePlayback();
      else startPlayback();
    });

    function playbackTick(now) {
      if (!state.isPlaying) return;
      const dt = (now - state.lastFrameTs) / 1000;
      state.lastFrameTs = now;

      const total = getTotalDuration();
      state.currentTime += dt;

      if (state.currentTime >= total) {
        state.currentTime = total;
        pausePlayback();
        seekToTimelineTime(total);
        return;
      }

      const info = getClipAtTimelineTime(state.currentTime);
      if (info) {
        const { clip, offset, duration } = info;
        const ratio = Math.min(1, offset / Math.max(0.01, duration));
        const effSpeed = getEffectiveSpeed(clip, ratio);

        state.clips.forEach(c => {
          if (c.id !== clip.id && !c.video.paused) c.video.pause();
        });

        clip.video.muted = clip.muted;
        clip.video.playbackRate = Math.min(4, Math.max(0.25, effSpeed));
        if (clip.video.paused) {
          clip.video.play().catch(() => {});
        }

        drawClipFrame(clip, offset);
      }

      curTimeEl.textContent = formatTime(state.currentTime);
      timelineScroll.scrollLeft = state.currentTime * PX_PER_SEC;
      requestAnimationFrame(playbackTick);
    }

    // Timeline UI & Independent Trim Handles
    function renderTimeline() {
      videoTrack.innerHTML = '';
      totTimeEl.textContent = formatTime(getTotalDuration());

      state.clips.forEach((clip, idx) => {
        const dur = getClipDuration(clip);
        const widthPx = Math.max(46, dur * PX_PER_SEC);

        const block = document.createElement('div');
        block.className = 'clip-block' + (clip.id === state.selectedClipId ? ' selected' : '');
        block.style.width = widthPx + 'px';

        const label = document.createElement('div');
        label.className = 'clip-label';
        label.textContent = `#${idx + 1} (${dur.toFixed(1)}s)`;
        block.appendChild(label);

        // Keyframe diamonds
        (clip.keyframes || []).forEach(kf => {
          const dot = document.createElement('div');
          dot.className = 'keyframe-dot';
          dot.style.left = Math.min(widthPx - 10, (kf.time / dur) * widthPx) + 'px';
          block.appendChild(dot);
        });

        // Left Trim Handle
        const leftHandle = document.createElement('div');
        leftHandle.className = 'trim-handle left';
        attachTrimLogic(leftHandle, clip, 'left');
        block.appendChild(leftHandle);

        // Right Trim Handle
        const rightHandle = document.createElement('div');
        rightHandle.className = 'trim-handle right';
        attachTrimLogic(rightHandle, clip, 'right');
        block.appendChild(rightHandle);

        block.addEventListener('click', (e) => {
          e.stopPropagation();
          state.selectedClipId = clip.id;
          renderTimeline();
        });

        videoTrack.appendChild(block);
      });

      // Audio Track
      audioTrackEl.innerHTML = '';
      if (state.audioTrack) {
        const aClip = document.createElement('div');
        aClip.className = 'audio-clip';
        aClip.style.width = Math.max(60, getTotalDuration() * PX_PER_SEC) + 'px';
        aClip.innerHTML = `<span>🎵</span><span>Audio Diekstrak (${state.audioTrack.name})</span>`;
        audioTrackEl.appendChild(aClip);
      }
    }

    function attachTrimLogic(handle, clip, side) {
      let startX = 0;
      let initTrimStart = 0;
      let initTrimEnd = 0;

      const onMove = (clientX) => {
        const dx = clientX - startX;
        const dSec = (dx / PX_PER_SEC) * clip.speed;
        if (side === 'left') {
          clip.trimStart = Math.max(0, Math.min(clip.trimEnd - 0.2, initTrimStart + dSec));
        } else {
          clip.trimEnd = Math.min(clip.rawDuration, Math.max(clip.trimStart + 0.2, initTrimEnd + dSec));
        }
        renderTimeline();
        seekToTimelineTime(state.currentTime);
      };

      handle.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        pausePlayback();
        startX = e.touches[0].clientX;
        initTrimStart = clip.trimStart;
        initTrimEnd = clip.trimEnd;
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        e.stopPropagation();
        onMove(e.touches[0].clientX);
      }, { passive: true });

      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        pausePlayback();
        startX = e.clientX;
        initTrimStart = clip.trimStart;
        initTrimEnd = clip.trimEnd;
        const mm = (ev) => onMove(ev.clientX);
        const mu = () => {
          window.removeEventListener('mousemove', mm);
          window.removeEventListener('mouseup', mu);
        };
        window.addEventListener('mousemove', mm);
        window.addEventListener('mouseup', mu);
      });
    }

    // Timeline Scroll Scrubbing
    timelineScroll.addEventListener('scroll', () => {
      if (state.isPlaying) return;
      state.isScrubbing = true;
      const t = timelineScroll.scrollLeft / PX_PER_SEC;
      seekToTimelineTime(t);
      clearTimeout(timelineScroll._t);
      timelineScroll._t = setTimeout(() => { state.isScrubbing = false; }, 100);
    });

    // Canvas Drag, Pinch & 9:16 Snapping Guides
    let dragStart = null;
    let initPos = { x: 0, y: 0, scale: 1 };
    let initPinchDist = 0;

    canvasWrapper.addEventListener('touchstart', (e) => {
      const clip = state.clips.find(c => c.id === state.selectedClipId);
      if (!clip) return;
      if (e.touches.length === 1) {
        dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        initPos = { x: clip.x, y: clip.y, scale: clip.scale };
      } else if (e.touches.length === 2) {
        initPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initPos.scale = clip.scale;
      }
    }, { passive: true });

    canvasWrapper.addEventListener('touchmove', (e) => {
      const clip = state.clips.find(c => c.id === state.selectedClipId);
      if (!clip) return;
      const rect = canvasWrapper.getBoundingClientRect();
      const ratioX = canvas.width / rect.width;

      if (e.touches.length === 1 && dragStart) {
        let nx = initPos.x + (e.touches[0].clientX - dragStart.x) * ratioX;
        let ny = initPos.y + (e.touches[0].clientY - dragStart.y) * ratioX;

        // Center Snapping threshold (18px)
        if (Math.abs(nx) < 18) {
          nx = 0;
          snapV.style.display = 'block';
        } else {
          snapV.style.display = 'none';
        }

        if (Math.abs(ny) < 18) {
          ny = 0;
          snapH.style.display = 'block';
        } else {
          snapH.style.display = 'none';
        }

        clip.x = nx;
        clip.y = ny;
        seekToTimelineTime(state.currentTime);
      } else if (e.touches.length === 2 && initPinchDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        clip.scale = Math.max(0.2, Math.min(4.0, initPos.scale * (dist / initPinchDist)));
        seekToTimelineTime(state.currentTime);
      }
    }, { passive: true });

    canvasWrapper.addEventListener('touchend', () => {
      dragStart = null;
      initPinchDist = 0;
      snapV.style.display = 'none';
      snapH.style.display = 'none';
    });

    // Tools: Split, Keyframe, Extract Audio, Speed, Reset, Delete
    document.getElementById('tool-split').addEventListener('click', () => {
      pausePlayback();
      const info = getClipAtTimelineTime(state.currentTime);
      if (!info) return;
      const { clip, offset, duration } = info;
      if (offset < 0.15 || duration - offset < 0.15) return;

      const ratio = offset / duration;
      const splitVideoTime = clip.trimStart + ratio * (clip.trimEnd - clip.trimStart);

      const secondClip = {
        ...clip,
        id: 'clip_' + Date.now(),
        video: clip.video.cloneNode(true),
        trimStart: splitVideoTime,
        keyframes: []
      };
      connectVideoAudio(secondClip.video);

      clip.trimEnd = splitVideoTime;
      const idx = state.clips.findIndex(c => c.id === clip.id);
      state.clips.splice(idx + 1, 0, secondClip);
      state.selectedClipId = secondClip.id;
      renderTimeline();
    });

    document.getElementById('btn-keyframe').addEventListener('click', () => {
      const info = getClipAtTimelineTime(state.currentTime);
      if (!info) return;
      const { clip, offset } = info;
      clip.keyframes.push({
        time: offset,
        x: clip.x,
        y: clip.y,
        scale: clip.scale
      });
      renderTimeline();
    });

    document.getElementById('tool-extract').addEventListener('click', () => {
      const clip = state.clips.find(c => c.id === state.selectedClipId) || state.clips[0];
      if (!clip) return;
      state.audioTrack = {
        name: clip.name.slice(0, 18),
        sourceClipId: clip.id
      };
      renderTimeline();
    });

    document.getElementById('tool-fit').addEventListener('click', () => {
      const clip = state.clips.find(c => c.id === state.selectedClipId);
      if (!clip) return;
      clip.x = 0;
      clip.y = 0;
      clip.scale = 1;
      clip.keyframes = [];
      renderTimeline();
      seekToTimelineTime(state.currentTime);
    });

    document.getElementById('tool-delete').addEventListener('click', () => {
      if (state.clips.length <= 1) return;
      pausePlayback();
      state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
      state.selectedClipId = state.clips[0].id;
      renderTimeline();
      seekToTimelineTime(0);
    });

    // Speed & Curve Panel
    const speedPanel = document.getElementById('speed-panel');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');

    document.getElementById('tool-speed').addEventListener('click', () => {
      const clip = state.clips.find(c => c.id === state.selectedClipId);
      if (!clip) return;
      speedSlider.value = clip.speed;
      speedVal.textContent = clip.speed.toFixed(2) + 'x';
      document.querySelectorAll('.preset-chip').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.curve === clip.curve);
      });
      speedPanel.classList.add('active');
    });

    document.getElementById('close-speed').addEventListener('click', () => {
      speedPanel.classList.remove('active');
    });

    speedSlider.addEventListener('input', () => {
      const clip = state.clips.find(c => c.id === state.selectedClipId);
      if (!clip) return;
      clip.speed = parseFloat(speedSlider.value);
      speedVal.textContent = clip.speed.toFixed(2) + 'x';
      renderTimeline();
    });

    document.querySelectorAll('.preset-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const clip = state.clips.find(c => c.id === state.selectedClipId);
        if (!clip) return;
        clip.curve = btn.dataset.curve;
        document.querySelectorAll('.preset-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTimeline();
      });
    });

    // Reliable Export (Canvas + Audio Stream)
    const exportModal = document.getElementById('export-modal');
    const exportProgress = document.getElementById('export-progress');
    const exportTitle = document.getElementById('export-title');
    const exportDesc = document.getElementById('export-desc');
    const btnDownloadResult = document.getElementById('btn-download-result');
    const btnCloseExport = document.getElementById('btn-close-export');

    document.getElementById('btn-export').addEventListener('click', async () => {
      if (state.clips.length === 0) return;
      pausePlayback();
      initAudioContext();

      exportModal.classList.add('active');
      exportTitle.textContent = 'Mengekspor Video...';
      exportDesc.textContent = 'Jangan tutup halaman saat proses rendering berlangsung.';
      exportProgress.style.width = '0%';
      btnDownloadResult.style.display = 'none';
      btnCloseExport.style.display = 'none';

      await seekToTimelineTime(0);

      const canvasStream = canvas.captureStream(30);
      const combinedTracks = [...canvasStream.getVideoTracks()];
      if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
        combinedTracks.push(...audioDest.stream.getAudioTracks());
      }
      const combinedStream = new MediaStream(combinedTracks);

      const mimeTypes = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const chosenMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';
      const recorder = new MediaRecorder(combinedStream, chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: 6000000 } : {});
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const ext = chosenMime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(chunks, { type: chosenMime || 'video/webm' });
        const url = URL.createObjectURL(blob);

        exportTitle.textContent = 'Ekspor Selesai!';
        exportDesc.textContent = `Format: .${ext.toUpperCase()} • Siap disimpan ke perangkat.`;
        exportProgress.style.width = '100%';
        btnDownloadResult.style.display = 'block';
        btnCloseExport.style.display = 'block';

        btnDownloadResult.onclick = () => {
          const a = document.createElement('a');
          a.href = url;
          a.download = `BluuStudio_${Date.now()}.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
      };

      recorder.start(100);
      state.currentTime = 0;
      state.isPlaying = true;
      let prevTs = performance.now();
      const totalDur = getTotalDuration();

      function exportStep(now) {
        if (!state.isPlaying) return;
        const dt = (now - prevTs) / 1000;
        prevTs = now;
        state.currentTime += dt;

        const pct = Math.min(99, (state.currentTime / Math.max(0.1, totalDur)) * 100);
        exportProgress.style.width = pct + '%';

        if (state.currentTime >= totalDur) {
          state.isPlaying = false;
          state.clips.forEach(c => c.video.pause());
          recorder.stop();
          return;
        }

        const info = getClipAtTimelineTime(state.currentTime);
        if (info) {
          const { clip, offset, duration } = info;
          const ratio = Math.min(1, offset / Math.max(0.01, duration));
          const effSpeed = getEffectiveSpeed(clip, ratio);

          state.clips.forEach(c => {
            if (c.id !== clip.id && !c.video.paused) c.video.pause();
          });

          clip.video.muted = clip.muted;
          clip.video.playbackRate = Math.min(4, Math.max(0.25, effSpeed));
          if (clip.video.paused) clip.video.play().catch(() => {});

          drawClipFrame(clip, offset);
        }

        requestAnimationFrame(exportStep);
      }

      requestAnimationFrame(exportStep);
    });

    btnCloseExport.addEventListener('click', () => {
      exportModal.classList.remove('active');
      seekToTimelineTime(0);
    });
  </script>
</body>
</html>
